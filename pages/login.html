<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/login.css">

    <title>Login | Ritmo Único</title>
</head>

<body>

    <div class="login-page">

        <div class="login-glow login-glow-left"></div>
        <div class="login-glow login-glow-right"></div>

        <main class="login-container">

            <div class="login-content">

                <!-- Logo -->
                <img
                    src="../assets/img/identidade Visual/Final logo.png"
                    alt="Logo do Ritmo Único"
                    class="login-logo"
                >

                <!-- Frase da marca -->
                <span class="login-tag">
                    Tecnologia para corredores
                </span>

                <!-- Caixa de login -->
                <div class="login-box">

                    <h2>Bem-vindo de volta</h2>

                    <p class="login-description">
                        Entre na sua conta e continue acompanhando sua evolução na corrida.
                    </p>

                    <form action="#" method="POST">

                        <div class="input-group">
                            <label for="email">E-mail</label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Digite seu e-mail"
                                required
                            >
                        </div>

                        <div class="input-group">
                            <label for="senha">Senha</label>

                            <input
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="Digite sua senha"
                                required
                            >
                        </div>

                        <div class="forgot-password">
                            <a href="#">
                                Esqueceu sua senha?
                            </a>
                        </div>

                        <button
                            type="submit"
                            class="login-button"
                        >
                            Entrar
                        </button>

                    </form>

                    <div class="divider">
                        <span>ou</span>
                    </div>

                    <p class="create-account">
                        Ainda não possui uma conta?
                        <a href="cadastro.html">
                            Criar conta
                        </a>
                    </p>

                </div>

                <!-- Voltar para página inicial -->
                <a href="../index.html" class="back-home">
                    ← Voltar para o início
                </a>

            </div>

        </main>

    </div>

</body>

</html>
