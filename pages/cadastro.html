<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta | Ritmo Único</title>
<link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>

<div class="cadastro-page">

<div class="cadastro-glow cadastro-glow-left"></div>
<div class="cadastro-glow cadastro-glow-right"></div>

<main class="cadastro-container">
<div class="cadastro-content">

<h1>Ritmo Único</h1>
<span class="cadastro-tag">Tecnologia para corredores</span>

<div class="cadastro-box">

<h2>Crie sua conta</h2>
<p class="cadastro-description">Crie sua conta e comece a acompanhar sua evolução na corrida.</p>

<form action="#" method="POST">

<div class="input-group">
<label for="nome">Nome completo</label>
<input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
</div>

<div class="input-group">
<label for="email">E-mail</label>
<input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
</div>

<div class="input-group">
<label for="data-nascimento">Data de nascimento</label>
<input type="date" id="data-nascimento" name="data_nascimento" required>
</div>

<div class="input-group">
<label for="senha">Senha</label>
<input type="password" id="senha" name="senha" placeholder="Crie uma senha" minlength="6" required>
</div>

<div class="input-group">
<label for="confirmar-senha">Confirmar senha</label>
<input type="password" id="confirmar-senha" name="confirmar_senha" placeholder="Digite a senha novamente" minlength="6" required>
</div>

<label class="terms">
<input type="checkbox" name="termos" required>
<span>Aceito os <a href="#">termos de uso</a> e a <a href="#">política de privacidade</a>.</span>
</label>

<button type="submit" class="cadastro-button">Criar minha conta</button>

</form>

<div class="divider">
<span>ou</span>
</div>

<p class="already-account">
Já possui uma conta?
<a href="login.html">Entrar</a>
</p>

</div>

<a href="index.html" class="back-home">← Voltar para o início</a>

</div>
</main>

</div>

</body>
</html>
