name: Deploy website on push

on:
  push:
    branches:
      - dev

jobs:
  web-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest code
        uses: actions/checkout@v6

      - name: Create database connection
        run: |
          cat > config/conexao.php <<'PHP'
          <?php

          $host = "sql306.infinityfree.com";
          $usuario = "if0_42995131";
          $senha = "${{ secrets.DB_PASSWORD }}";
          $banco = "if0_42995131_ritmounico";
          // Deploy atualizado em 01/10/2026

          $conexao = new mysqli($host, $usuario, $senha, $banco, 3306);

          if ($conexao->connect_error) {
              die("Erro na conexão com o banco: " . $conexao->connect_error);
          }

          $conexao->set_charset("utf8mb4");
          PHP

      - name: Verify database connection file
        run: |
          echo "Verificando usuario do banco..."
          grep -F '$usuario = "if0_42995131";' config/conexao.php

          echo "Verificando se a senha foi preenchida..."
          if grep -Fq '$senha = "";' config/conexao.php; then
            echo "ERRO: DB_PASSWORD esta vazio."
            exit 1
          else
            echo "OK: senha foi preenchida."
          fi

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /htdocs/
          exclude: |
            **/uploads/**
            **/.git*
            **/.git*/**